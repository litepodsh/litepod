name: Bug or feature / Bug o funcionalidad
description: Report a bug or request a feature — Reporta un bug o pide una funcionalidad
labels: []
body:
  - type: dropdown
    id: type
    attributes:
      label: Type / Tipo
      description: What is this about? / ¿De qué se trata?
      options:
        - Bug report / Reporte de bug
        - Feature request / Petición de funcionalidad
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: Describe it / Descríbelo
      description: |
        Bug: what happens, what you expected, and steps to reproduce.
        Feature: what you want and why it matters.

        Bug: qué ocurre, qué esperabas y pasos para reproducirlo.
        Funcionalidad: qué quieres y por qué importa.
      placeholder: "Describe the problem, not the solution. / Describe el problema, no la solución."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Versión
      description: Shown on the System page. / Aparece en la página Sistema.
      placeholder: v0.3.39
    validations:
      required: false
  - type: dropdown
    id: channel
    attributes:
      label: Channel / Canal
      description: Update channel, shown on the System page. / Canal de actualizaciones, aparece en la página Sistema.
      options:
        - Stable
        - Next
        - Not sure / No sé
    validations:
      required: false
  - type: dropdown
    id: install
    attributes:
      label: Install / Instalación
      options:
        - Self-hosted rootless
        - Self-hosted root
        - Litepod Cloud
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context / Contexto
      description: Screenshots, logs, OS — anything that helps. / Capturas, logs, sistema operativo — lo que ayude.
    validations:
      required: false
