name: release

# Multiarch release to Docker Hub, split into parallel jobs:
#   prepare        -> resolve + validate version/channel/caddy pin
#   build (amd64)  -> native binary + image + probe        } in parallel
#   build (arm64)  -> `cross` binary + qemu image + probe  }
#   publish        -> load both images, assemble the manifest list, push
# Mirrors `just release-dockerhub` (used on the Linux release server); keep the
# build args, label check and probes in sync with that recipe.
#
# Triggers:
#   - push a tag vX.Y.Z           -> stable channel (:vX.Y.Z + :latest)
#   - dispatch on `next` with vX.Y.Z-next.N and dry_run=false
#                                 -> next channel  (:vX.Y.Z-next.N + :next)
#   - push a tag vX.Y.Z-next.N   -> next channel too (same result)
#   - manual dispatch with a version (same rules). `dry_run` (default on)
#     builds, probes and assembles the manifest but pushes nothing.
#   - push to main or next touching the Rust deps, or weekly (main) -> cache warm-up: only
#     the binaries are built, no image, nothing published.
#
# The runners are always fresh, so the Dockerfile's sccache mount is empty
# every run. Both binaries are therefore built on the runner and COPYed in
# (PREBUILT_API), with `api/target` persisted per arch by rust-cache.
# Actions caches are scoped per ref: a tag run can only restore caches saved
# by its own tag or by main, and every release is a new tag. So stable
# releases (tagged on main) are warmed by a dry run on main: `just bump litepod`
# dispatches it first and the tag run queues behind it (concurrency group).
# Next releases do not use tags to start: `just bump-next litepod` dispatches
# this workflow on the `next` branch, which saves and restores its own cache
# (save-if below), and the release creates the vX.Y.Z-next.N tag itself. A push
# to `next` touching Cargo.lock re-warms that cache. The weekly schedule only
# runs on main, so an idle `next` cache can expire after 7 days (cold build).
#
# version.json and the install scripts are published from the website
# (litepod.sh), not here.

on:
  push:
    tags:
      - "v*.*.*"
    # Path filters are not evaluated for tag pushes, so tags still trigger.
    branches: [main, next]
    paths: ["apps/api/Cargo.lock", "apps/api/Cross.toml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag: vX.Y.Z (stable) or vX.Y.Z-next.N (next)"
        required: true
      dry_run:
        description: "Test the release: build + probe everything, push nothing"
        type: boolean
        default: true

# Warm-ups get their own group: a queued warm-up must never replace a queued
# release in the same group.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && 'release' || 'release-cache-warm' }}
  cancel-in-progress: false

permissions:
  contents: read

# The project (Dockerfile, api/, ui/, podx/) lives in apps/.
defaults:
  run:
    working-directory: apps

jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      warm: ${{ steps.version.outputs.warm }}
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Resolve version and channel
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == schedule || "${GITHUB_REF_TYPE}" == branch && "${GITHUB_EVENT_NAME}" == push ]]; then
            echo "version=cache-warm" >> "$GITHUB_OUTPUT"
            echo "warm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          if [[ "${version}" == *-next.* ]]; then channel=next; else channel=stable; fi
          bash podx/scripts/validate-release-tag.sh "${channel}" "${version}"
          # A real (non-dry) next release may only come from a tag or from the
          # `next` branch, whose rust cache it shares. Never from main or a PR branch.
          if [[ "${channel}" == next && "${DRY_RUN}" != true && "${GITHUB_REF_TYPE}" == branch && "${GITHUB_REF_NAME}" != next ]]; then
            echo "next releases dispatch from the next branch, not ${GITHUB_REF_NAME}" >&2; exit 1
          fi
          # scripts/install.sh is a symlink into the web repo, absent in CI.
          caddy="$(sed -n 's/.*docker\.io\/library\/caddy:\${CADDY_IMAGE_TAG:-\([^}]*\)}.*/\1/p' podman-compose-prod.yml)"
          : "${caddy:?caddy pin missing in podman-compose-prod.yml}"
          [[ "${caddy}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ && "${caddy}" != latest ]] || {
            echo "invalid core service tag: ${caddy}" >&2; exit 1;
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE: localhost/litepod-build-${{ matrix.arch }}:${{ needs.prepare.outputs.version }}
    steps:
      - uses: useblacksmith/checkout@v1

      # The release cargo build (duckdb, etc.) overflows the runner's default
      # free disk otherwise ("no space left on device").
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-unknown-linux-gnu' || '' }}

      # rust-cache's post step runs `cargo metadata` inside apps/api, which
      # reads apps/api/.cargo/config.toml (rustc-wrapper = "sccache"). Without
      # sccache on PATH that call fails, rust-cache wipes api/target and saves
      # a near-empty cache that later runs hit as an exact match, so every
      # release compiled from scratch.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
          key: ${{ matrix.arch }}
          # Bumped from the default v0 to skip the near-empty caches saved
          # while the cargo metadata call above was failing.
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}

      - uses: taiki-e/install-action@v2
        if: matrix.arch == 'arm64'
        with:
          tool: cross

      # Blacksmith hands out cold VMs whose host has no binfmt_misc mount. The
      # privileged tonistiigi/binfmt container then registers qemu-aarch64 in
      # its own mount namespace ("installing: arm64 OK") and the handler dies
      # with the container, so `podman build --platform linux/arm64` later
      # fails with `exec container process /bin/sh: Exec format error`.
      # Mount it on the host first so the registration lands in the kernel.
      - name: Mount binfmt_misc (Blacksmith cold VMs)
        if: matrix.arch == 'arm64' && needs.prepare.outputs.warm != 'true'
        run: |
          mountpoint -q /proc/sys/fs/binfmt_misc || {
            sudo modprobe binfmt_misc || true
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          }

      - name: Register qemu binfmt (arm64 image build + probe)
        if: matrix.arch == 'arm64' && needs.prepare.outputs.warm != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Fail fast and clearly here instead of 10 minutes later with an opaque
      # exec-format error inside `podman build`.
      - name: Assert arm64 emulation
        if: matrix.arch == 'arm64' && needs.prepare.outputs.warm != 'true'
        run: grep -q enabled /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Install native deps (xmlsec1 for saml, libclang for bindgen)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxmlsec1-dev libclang-dev

      - name: cargo build amd64 binary
        if: matrix.arch == 'amd64'
        run: cargo build --release --features saml --manifest-path api/Cargo.toml

      # Natively cross-compiled on the amd64 host; the Dockerfile's arm64
      # stage only copies it in (PREBUILT_API), so no Rust runs under qemu.
      - name: cross build arm64 binary
        if: matrix.arch == 'arm64'
        env:
          CROSS_CONTAINER_ENGINE: podman
        run: |
          cross build --release \
            --features saml \
            --target aarch64-unknown-linux-gnu \
            --manifest-path api/Cargo.toml \
            --target-dir api/target

      - name: podman build (linux/${{ matrix.arch }})
        if: needs.prepare.outputs.warm != 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          extra=()
          if [[ "${ARCH}" == arm64 ]]; then
            extra+=(--build-arg PREBUILT_API=api/target/aarch64-unknown-linux-gnu/release/litepod-api)
          else
            extra+=(--build-arg AMD64_API=prebuilt --build-arg PREBUILT_API=api/target/release/litepod-api)
          fi
          podman build --platform="linux/${ARCH}" \
            -f Dockerfile \
            --build-arg VITE_API_URL="" \
            --build-arg LITEPOD_VERSION="${VERSION}" \
            --build-arg LITEPOD_GIT_SHA="${GITHUB_SHA::7}" \
            --build-arg TARGETARCH="${ARCH}" \
            "${extra[@]}" \
            -t "${IMAGE}" \
            .

      # Version label gate + podman/podman-compose/CA probes, as in
      # `just release-dockerhub`. dpkg queries, not `podman`, because podman
      # segfaults under qemu.
      - name: Probe image
        if: needs.prepare.outputs.warm != 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          label="$(podman image inspect --format '{{ index .Labels "org.opencontainers.image.version" }}' "${IMAGE}")"
          [[ "${label}" == "${VERSION}" ]] || { echo "version label mismatch: expected ${VERSION}, got ${label:-<missing>}" >&2; exit 1; }
          run() { podman run --rm --platform="linux/${ARCH}" "$@"; }
          run --entrypoint /bin/sh "${IMAGE}" -c 'test -x /usr/bin/podman'
          run --entrypoint /bin/sh "${IMAGE}" -c 'dpkg --compare-versions "$(dpkg-query -W podman | cut -f2)" ge 4.7'
          run --entrypoint /bin/sh "${IMAGE}" -c 'test -x /usr/bin/podman-compose && dpkg-query -W podman-compose'
          run --entrypoint /usr/bin/test "${IMAGE}" -s /etc/ssl/certs/ca-certificates.crt

      - name: Save image
        if: needs.prepare.outputs.warm != 'true'
        run: podman save -o "${RUNNER_TEMP}/image-${{ matrix.arch }}.tar" "${IMAGE}"

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.warm != 'true'
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          retention-days: 1

  # FreeBSD runs litepod natively (install-freebsd.sh): the API binary and the UI
  # build, as one archive attached to the GitHub release. GitHub has no FreeBSD
  # runners, so the binary is compiled inside a FreeBSD VM (KVM on the hosted
  # Ubuntu runner); duckdb and aws-lc are C/C++ and do not cross-compile cleanly.
  build-freebsd:
    needs: prepare
    if: needs.prepare.outputs.warm != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build UI
        working-directory: apps/ui
        env:
          VITE_API_URL: ""
          VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAEJF4ZVxaxz5WzUH"
        run: |
          bun install --frozen-lockfile
          bun run build
          test -f build/404.html
          # Same trim as the Dockerfile: plaintext and json are the only Monaco languages used.
          rm -f build/_app/immutable/workers/ts.worker-*.js* \
                build/_app/immutable/workers/css.worker-*.js* \
                build/_app/immutable/workers/html.worker-*.js*

      - name: Build API on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          mem: 8192
          usesh: true
          prepare: pkg install -y rust cmake gmake pkgconf perl5 xmlsec1 llvm
          run: |
            set -e
            cd apps/api
            rm -f .cargo/config.toml
            cargo build --release --locked --features saml
            # The VM syncs the workspace back to the runner: hand back the binary, not target/.
            cp target/release/litepod-api ../litepod-api-freebsd
            rm -rf target

      - name: Package
        run: |
          name="litepod-${VERSION}-x86_64-unknown-freebsd.tar.gz"
          staging="${RUNNER_TEMP}/freebsd"
          mkdir -p "${staging}"
          cp litepod-api-freebsd "${staging}/litepod-api"
          cp -R ui/build "${staging}/ui"
          # The API reads its migrations from the directory next to the binary.
          cp -R api/migrations "${staging}/migrations"
          tar -C "${staging}" -czf "${RUNNER_TEMP}/${name}" litepod-api ui migrations
          (cd "${RUNNER_TEMP}" && sha256sum "${name}" > "${name}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd
          path: ${{ runner.temp }}/litepod-*-x86_64-unknown-freebsd.tar.gz*
          retention-days: 1

  # OpenBSD has no Podman, so litepod runs there as the control panel only
  # (install-openbsd.sh). OpenBSD changes its libc ABI between releases, so the
  # archive is built for one release and named after it.
  build-openbsd:
    needs: prepare
    if: needs.prepare.outputs.warm != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      OPENBSD_RELEASE: "8.0"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build UI
        working-directory: apps/ui
        env:
          VITE_API_URL: ""
          VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAEJF4ZVxaxz5WzUH"
        run: |
          bun install --frozen-lockfile
          bun run build
          test -f build/404.html
          rm -f build/_app/immutable/workers/ts.worker-*.js* \
                build/_app/immutable/workers/css.worker-*.js* \
                build/_app/immutable/workers/html.worker-*.js*

      - name: Build API on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ env.OPENBSD_RELEASE }}
          mem: 8192
          usesh: true
          prepare: pkg_add -I rust cmake gmake xmlsec llvm%21 duckdb
          run: |
            set -e
            df -h
            cd apps/api
            rm -f .cargo/config.toml
            # Root's default datasize limit is too small to link the API.
            ulimit -d unlimited
            ulimit -n 1024
            # samael's bindgen needs libclang, which OpenBSD keeps outside the default paths.
            export LIBCLANG_PATH=/usr/local/llvm21/lib
            # Cargo.toml links duckdb from packages on OpenBSD; without these it looks for a prebuilt one.
            export DUCKDB_LIB_DIR=/usr/local/lib DUCKDB_INCLUDE_DIR=/usr/local/include
            # Keep the registry next to the sources: the VM's root partition is small.
            export CARGO_HOME="$(pwd)/../.cargo-home"
            # Fastest compile, not fastest binary: the VM build at -O3 is too slow (C++ in duckdb).
            cargo build --release --locked --features saml \
              --config profile.release.opt-level=0 --config profile.release.codegen-units=256
            cp target/release/litepod-api ../litepod-api-openbsd
            rm -rf target "${CARGO_HOME}"

      - name: Package
        run: |
          name="litepod-${VERSION}-x86_64-unknown-openbsd${OPENBSD_RELEASE}.tar.gz"
          staging="${RUNNER_TEMP}/openbsd"
          mkdir -p "${staging}"
          cp litepod-api-openbsd "${staging}/litepod-api"
          cp -R ui/build "${staging}/ui"
          cp -R api/migrations "${staging}/migrations"
          # install-openbsd.sh refuses an archive built for another OpenBSD release.
          printf '%s\n' "${OPENBSD_RELEASE}" > "${staging}/openbsd-release"
          tar -C "${staging}" -czf "${RUNNER_TEMP}/${name}" litepod-api ui migrations openbsd-release
          (cd "${RUNNER_TEMP}" && sha256sum "${name}" > "${name}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: openbsd
          path: ${{ runner.temp }}/litepod-*-x86_64-unknown-openbsd*.tar.gz*
          retention-days: 1

  publish:
    needs: [prepare, build, build-freebsd, build-openbsd]
    if: needs.prepare.outputs.warm != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      REPOSITORY: litepod/litepod
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          # git-cliff needs the previous tags to compute the release range.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Assemble manifest list
        run: |
          local_manifest="localhost/litepod-release:${VERSION}"
          podman manifest create "${local_manifest}"
          for a in amd64 arm64; do
            podman load -i "${RUNNER_TEMP}/images/image-${a}.tar"
            podman manifest add "${local_manifest}" "containers-storage:localhost/litepod-build-${a}:${VERSION}"
          done
          podman manifest inspect "${local_manifest}"

      - name: podman login docker.io
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_TOKEN:?secret DOCKERHUB_TOKEN is not set}"
          printf '%s' "${DOCKERHUB_TOKEN}" | podman login docker.io -u litepod --password-stdin

      - name: Push
        run: |
          local_manifest="localhost/litepod-release:${VERSION}"
          immutable_image="docker.io/${REPOSITORY}:${VERSION}"
          moving_tag=latest
          [[ "${CHANNEL}" == next ]] && moving_tag=next
          moving_image="docker.io/${REPOSITORY}:${moving_tag}"
          # Resumable: never republish the immutable tag if the registry
          # already resolves it — see podx/scripts/check-immutable-tag.sh.
          immutable_state="$(IMAGE="${immutable_image}" REPOSITORY="${REPOSITORY}" TAG="${VERSION}" \
            bash podx/scripts/check-immutable-tag.sh)"
          if [[ "${DRY_RUN}" == true ]]; then
            echo "dry run: immutable tag is ${immutable_state} on Docker Hub; skipped push of ${immutable_image} and ${moving_image}"
            exit 0
          fi
          if [[ "${immutable_state}" == absent ]]; then
            podman manifest push --all "${local_manifest}" "${immutable_image}"
          else
            echo "immutable tag ${VERSION} already exists; reusing the remote release artifact"
          fi
          IMAGE="${immutable_image}" REPOSITORY="${REPOSITORY}" TAG="${VERSION}" \
            bash podx/scripts/wait-for-immutable-tag.sh
          podman manifest push --all "${local_manifest}" "${moving_image}"

      # The in-app "Release notes" link points at the GitHub releases page, so
      # every tag gets a release with notes generated from its commits.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: GitHub release
        if: env.DRY_RUN != 'true' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && env.CHANNEL == 'next'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "release ${VERSION} already exists"
            exit 0
          fi
          flags=()
          [[ "${CHANNEL}" == next ]] && flags+=(--prerelease)
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            git cliff --latest -o "${RUNNER_TEMP}/notes.md"
            flags+=(--verify-tag)
          else
            # Dispatched from the next branch: the tag does not exist yet, so
            # the release creates it at this commit and the notes cover the
            # commits since the previous tag.
            git cliff --unreleased --tag "${VERSION}" -o "${RUNNER_TEMP}/notes.md"
            flags+=(--target "${GITHUB_SHA}")
          fi
          gh release create "${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" --title "${VERSION}" "${flags[@]}"

      - uses: actions/download-artifact@v4
        if: env.DRY_RUN != 'true' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && env.CHANNEL == 'next'))
        with:
          name: freebsd
          path: ${{ runner.temp }}/freebsd

      # Separate from the step above, which stops early when the release exists: a
      # re-run must still attach the FreeBSD archive that install-freebsd.sh downloads.
      - name: Attach FreeBSD build
        if: env.DRY_RUN != 'true' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && env.CHANNEL == 'next'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${VERSION}" "${RUNNER_TEMP}"/freebsd/* --clobber

      - uses: actions/download-artifact@v4
        if: env.DRY_RUN != 'true' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && env.CHANNEL == 'next'))
        with:
          name: openbsd
          path: ${{ runner.temp }}/openbsd

      - name: Attach OpenBSD build
        if: env.DRY_RUN != 'true' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && env.CHANNEL == 'next'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${VERSION}" "${RUNNER_TEMP}"/openbsd/* --clobber

      - name: Summary
        run: |
          {
            if [[ "${DRY_RUN}" == true ]]; then
              echo "### Dry run OK: ${VERSION} (${CHANNEL}, multiarch), nothing pushed"
            else
              echo "### Released ${VERSION} (${CHANNEL}, multiarch)"
              echo "- image: \`docker.io/${REPOSITORY}:${VERSION}\`"
            fi
            echo "- sha: ${GITHUB_SHA::7}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        run: podman logout docker.io || true
