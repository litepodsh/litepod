name: ci

# Compile gate for main and next: API (with the `saml` feature the release binary
# ships) and UI type-check + build, plus dependency advisories (`cargo audit`,
# `bun audit` at high and above). The Dockerfile is exercised by the release
# workflow (manual dispatch defaults to a dry run).

on:
  push:
    branches: [main, next]
    paths: ["apps/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # apps/api/.cargo/config.toml sets rustc-wrapper = "sccache"; back it with
      # the GitHub Actions cache.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Install native deps (xmlsec1 for saml, libclang for bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxmlsec1-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api

      - name: cargo build
        run: cargo build --locked --features saml

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on a vulnerability advisory; "unmaintained"/"unsound" stay warnings.
      - name: cargo audit
        run: cargo audit

  # The release builds the OpenBSD binary (install-openbsd.sh); this catches a break
  # before then. Same VM, packages and settings as release.yml's build-openbsd.
  api-openbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: cargo check on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: "8.0"
          mem: 8192
          usesh: true
          copyback: false
          prepare: pkg_add -I rust cmake gmake xmlsec llvm%21
          run: |
            set -e
            cd apps/api
            rm -f .cargo/config.toml
            ulimit -d unlimited
            ulimit -n 1024
            export LIBCLANG_PATH=/usr/local/llvm21/lib
            export CARGO_HOME="$(pwd)/../.cargo-home"
            # Cargo.toml builds dependencies at -O3 even in dev; a compile check does not need it.
            cargo check --locked --features saml --config 'profile.dev.package."*".opt-level=0'

  ui:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run check
      - run: bun run build
