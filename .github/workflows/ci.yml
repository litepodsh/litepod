name: ci

# Compile gate for main: API (with the `saml` feature the release binary
# ships) and UI type-check + build. The Dockerfile is exercised by the release
# workflow (manual dispatch defaults to a dry run).

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    env:
      # apps/api/.cargo/config.toml sets rustc-wrapper = "sccache"; back it with
      # the GitHub Actions cache.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps (xmlsec1 for saml, libclang for bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxmlsec1-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api

      - name: cargo build
        run: cargo build --locked --features saml

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
