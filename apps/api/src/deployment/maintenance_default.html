<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="litepod-maintenance" content="1">
<title>Back soon</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='10' y='10' width='100' height='100' rx='26' fill='%23D4410B'/%3E%3Crect x='34' y='42' width='52' height='36' rx='18' fill='%23FFFFFF' transform='rotate(-24 60 60)'/%3E%3C/svg%3E">
<style>
  /* Dark unless the system asks for light. */
  :root {
    color-scheme: dark;
    --ground: #0a0a0a;
    --cell: #1a1a1a;
    --ink: #fff;
    --muted: #b0b0b0;
    --accent: #ff6a1f;
    --cell-size: 10px;
    --gap: 1px;
  }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --ground: #fafafa; --cell: #efefef; --ink: #0f0f0f; --muted: #5e5e5e; --accent: #d4410b; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* The pixel field: drawn with CSS so it shows even where scripts do not run. */
  /* Covers the whole viewport; `--play` (set by the script) is where the game ends
     and the grid fades out behind the text. */
  .board { position: fixed; inset: 0; touch-action: none; }
  /* Only the grid fades; what the game draws stays visible down to the black. */
  .board::before {
    content: "";
    position: absolute;
    inset: 0;
    background-color: var(--cell);
    background-image:
      linear-gradient(to right, var(--ground) var(--gap), transparent var(--gap)),
      linear-gradient(to bottom, var(--ground) var(--gap), transparent var(--gap));
    background-size: var(--cell-size) var(--cell-size);
    -webkit-mask-image: linear-gradient(#000 var(--play, 62vh), transparent calc(var(--play, 62vh) + 9rem));
    mask-image: linear-gradient(#000 var(--play, 62vh), transparent calc(var(--play, 62vh) + 9rem));
  }
  .board canvas { position: relative; }
  .hud {
    position: fixed;
    inset: 0 0 auto 0;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: .9rem clamp(1rem, 3vw, 1.5rem);
    font: 500 .75rem/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted);
    pointer-events: none;
  }
  .hud p { margin: 0; }
  .back {
    position: fixed;
    top: 3.25rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .6rem .6rem .6rem 1rem;
    border: 1px solid color-mix(in oklab, var(--ink) 16%, transparent);
    border-radius: .5rem;
    background: var(--ground);
    font: 500 .8rem/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--ink);
    white-space: nowrap;
  }
  .back[hidden] { display: none; }
  .back .pulse { flex: none; }
  .back button {
    padding: .35rem .7rem;
    border: 1px solid color-mix(in oklab, var(--ink) 16%, transparent);
    border-radius: .35rem;
    background: transparent;
    font: inherit;
    color: var(--muted);
    cursor: pointer;
  }
  .back button.go { border-color: var(--accent); background: var(--accent); color: #fff; }
  .board canvas { display: block; width: 100%; height: 100%; }
  main {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 2.5rem;
    max-width: 72rem;
    margin: 0 auto;
    padding: 0 clamp(1.25rem, 5vw, 3rem) clamp(1.5rem, 4vh, 2.5rem);
    pointer-events: none;
  }
  main a, main button { pointer-events: auto; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    margin: 0 0 1.1rem;
    font: 500 .75rem/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .pulse {
    width: .5rem; height: .5rem;
    background: var(--accent);
    animation: pulse 1.6s steps(2, jump-none) infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 {
    margin: 0;
    max-width: 18ch;
    font-size: clamp(2rem, 5vw, 3.75rem);
    line-height: .98;
    font-weight: 600;
    letter-spacing: -.045em;
  }
  .lede {
    margin: 1.25rem 0 0;
    max-width: 34rem;
    font-size: clamp(1rem, 1.6vw, 1.125rem);
    line-height: 1.55;
    color: var(--muted);
  }
  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding-top: 1.25rem;
    border-top: 1px solid color-mix(in oklab, var(--ink) 10%, transparent);
    font: 500 .75rem/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted);
  }
  .hint kbd {
    display: inline-block;
    min-width: 1.4rem;
    padding: .15rem .35rem;
    border: 1px solid color-mix(in oklab, var(--ink) 16%, transparent);
    border-bottom-width: 2px;
    border-radius: .3rem;
    font: inherit;
    text-align: center;
    color: var(--ink);
  }
  .score { color: var(--ink); font-variant-numeric: tabular-nums; }
  .score span { color: var(--muted); }
  .brand { display: inline-flex; align-items: center; gap: .5rem; }
  .brand svg { width: 1rem; height: 1rem; }
  .noscript-hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
</head>
<body>
<div class="board" aria-hidden="true"><canvas></canvas></div>
<div class="hud noscript-hidden">
  <p class="score" id="score"><span data-i18n="score">Score</span> <b id="points">0</b> &nbsp;<span data-i18n="best">Best</span> <b id="best">0</b></p>
  <p class="hint" id="hint"><span id="hint-text"></span> <span id="hint-keys"></span></p>
</div>
<div class="back" id="back" role="status" hidden>
  <span class="pulse"></span>
  <span id="back-text"></span>
  <button type="button" class="go" id="back-go"></button>
  <button type="button" id="back-cancel"></button>
</div>
<main>
  <section>
    <p class="eyebrow"><span class="pulse"></span><span data-i18n="eyebrow">503 · Maintenance</span></p>
    <h1 data-i18n="title">We'll be right back.</h1>
    <p class="lede" data-i18n="lede">This site is getting some maintenance and will be back in a few minutes. Nothing to do on your side: just refresh in a bit.</p>
  </section>
  <footer>
    <span class="brand">
      <svg viewBox="0 0 120 120" aria-hidden="true"><rect x="10" y="10" width="100" height="100" rx="26" fill="var(--accent)"/><rect x="34" y="42" width="52" height="36" rx="18" fill="#fff" transform="rotate(-24 60 60)"/></svg>
      <span data-i18n="brand">Served by Litepod</span>
    </span>
  </footer>
</main>
<script>
(() => {
  const es = /^es\b/i.test(navigator.language || '');
  const touch = matchMedia('(pointer: coarse)').matches;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (es) {
    document.documentElement.lang = 'es';
    document.title = 'Volvemos pronto';
    const text = {
      eyebrow: '503 · Mantenimiento',
      title: 'Volvemos enseguida.',
      lede: 'Este sitio está en mantenimiento y vuelve en unos minutos. No tienes que hacer nada: recarga en un rato.',
      score: 'Puntos',
      best: 'Récord',
      brand: 'Servido por Litepod',
    };
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = text[el.dataset.i18n]; });
  }
  document.querySelectorAll('.noscript-hidden').forEach((el) => el.classList.remove('noscript-hidden'));

  const board = document.querySelector('.board');
  const canvas = board.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const pointsEl = document.getElementById('points');
  const bestEl = document.getElementById('best');
  // SIZE matches --cell-size. A game cell is `game.unit` x `game.unit` of these
  // small squares, so every game is drawn on the same fine grid.
  const SIZE = 10, GAP = 1;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const rand = (n) => Math.floor(Math.random() * n);
  const opposite = (a, b) => DIRS[a][0] === -DIRS[b][0] && DIRS[a][1] === -DIRS[b][1];

  let cols, rows, U, colors, game, playing = false, dead = 0, points = 0, best = 0, last = 0, running = false;

  function cell(x, y, color, alpha = 1, grow = 0) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    for (let i = 0; i < game.unit; i++) for (let j = 0; j < game.unit; j++) {
      const px = (x * game.unit + i) * SIZE, py = (y * game.unit + j) * SIZE;
      ctx.fillRect(px + GAP - grow, py + GAP - grow, SIZE - GAP + grow * 2, SIZE - GAP + grow * 2);
    }
  }
  function dot(x, y, color, alpha, size) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    const o = GAP + (U - GAP - size) / 2;
    ctx.fillRect(x * U + o, y * U + o, size, size);
  }
  // The Litepod logo over `span` x `span` cells: an orange tile with a tilted white capsule.
  function logo(x, y, alpha, span = 1) {
    const s = span * U - GAP, cx = x * U + GAP + s / 2, cy = y * U + GAP + s / 2;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = colors.accent;
    ctx.beginPath();
    ctx.roundRect(cx - s / 2, cy - s / 2, s, s, s * 0.26);
    ctx.fill();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((-24 * Math.PI) / 180);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.roundRect(-s * 0.26, -s * 0.18, s * 0.52, s * 0.36, s * 0.18);
    ctx.fill();
    ctx.restore();
  }
  function score(n = 1) {
    if (!playing) return;
    points += n;
    pointsEl.textContent = points;
    if (points > best) {
      bestEl.textContent = best = points;
      try { localStorage.setItem(`litepod-best-${game.name}`, best); } catch {}
    }
  }
  const die = () => { dead = 8; };

  // ---- Snake: eat the orange squares, do not bite yourself. Now and then a
  // Litepod logo shows up for 16 seconds: a bonus worth more squares and points.
  // The edges wrap around.
  const snake = (() => {
    const FOODS = 2, BONUS_CHANCE = 1 / 250, BONUS_GROW = 5, BONUS_MS = 16000;
    let body, dir, queue, foods, bonus, sparks, grow;
    const occupied = (x, y) => body.some(([bx, by]) => bx === x && by === y);
    const wrap = (x, y) => [(x + cols) % cols, (y + rows) % rows];
    // A piece covers `size` x `size` cells from its top-left corner.
    const covers = (f, x, y) => x >= f.x && x < f.x + f.size && y >= f.y && y < f.y + f.size;
    const taken = (f) => [...foods, ...(bonus ? [bonus] : [])].some((o) => f.x < o.x + o.size + 1 && o.x < f.x + f.size + 1 && f.y < o.y + o.size + 1 && o.y < f.y + f.size + 1);
    // Distance on a board whose edges meet.
    const span = (a, b, n) => Math.min(Math.abs(a - b), n - Math.abs(a - b));
    function spot(size) {
      let f;
      do f = { x: rand(cols - size + 1), y: rand(rows - size + 1), size };
      while (body.some(([x, y]) => covers(f, x, y)) || taken(f));
      return f;
    }
    function autopilot() {
      const [hx, hy] = body[0];
      const targets = bonus ? [...foods, bonus] : foods;
      const best = Object.keys(DIRS).filter((d) => !opposite(d, dir)).map((d) => {
        const [nx, ny] = wrap(hx + DIRS[d][0], hy + DIRS[d][1]);
        const safe = !occupied(nx, ny);
        const room = safe ? Object.values(DIRS).filter(([dx, dy]) => !occupied(...wrap(nx + dx, ny + dy))).length : 0;
        const near = Math.min(...targets.map((f) => span(nx, f.x, cols) + span(ny, f.y, rows) - (f === bonus ? 6 : 0)));
        return { d, score: safe ? near - room * 0.5 : Infinity };
      }).sort((a, b) => a.score - b.score)[0];
      if (best.score !== Infinity) dir = best.d;
    }
    return {
      name: 'snake',
      unit: 1,
      keys: 'arrows',
      accepts: (a) => a in DIRS,
      interval: () => (playing ? 55 : 70),
      reset() {
        const y = Math.floor(rows / 2), x = Math.floor(cols / 3);
        body = Array.from({ length: 8 }, (_, i) => [x - i, y]);
        dir = 'right';
        queue = [];
        sparks = [];
        foods = [];
        bonus = null;
        grow = 0;
        for (let i = 0; i < FOODS; i++) foods.push(spot(1));
      },
      input(next) {
        const lastDir = queue.length ? queue[queue.length - 1] : dir;
        if (next !== lastDir && !opposite(next, lastDir) && queue.length < 3) queue.push(next);
      },
      step() {
        if (playing && queue.length) dir = queue.shift();
        if (!playing) autopilot();
        const head = wrap(body[0][0] + DIRS[dir][0], body[0][1] + DIRS[dir][1]);
        if (occupied(...head)) return die();
        body.unshift(head);
        const hit = foods.findIndex((f) => covers(f, head[0], head[1]));
        if (hit >= 0) {
          const [f] = foods.splice(hit, 1);
          sparks.push({ ...f, life: 1 });
          grow += 1;
          foods.push(spot(1));
          score();
        } else if (bonus && covers(bonus, head[0], head[1])) {
          sparks.push({ ...bonus, life: 1 });
          grow += BONUS_GROW;
          score(BONUS_GROW);
          bonus = null;
        }
        if (bonus && performance.now() > bonus.until) bonus = null;
        // About one step in 250 (roughly every 15 to 20 seconds) a bonus shows up.
        if (!bonus && Math.random() < BONUS_CHANCE) bonus = { ...spot(2), until: performance.now() + BONUS_MS };
        if (grow > 0) grow--;
        else body.pop();
      },
      draw(time, hidden) {
        foods.forEach((f, i) => cell(f.x, f.y, colors.accent, 0.7 + 0.3 * Math.sin(time / 220 + i)));
        // The bonus blinks in its last three seconds.
        if (bonus && (bonus.until - performance.now() > 3000 || Math.floor(time / 120) % 2)) logo(bonus.x, bonus.y, 1, 2);
        sparks = sparks.filter((s) => (s.life -= 0.06) > 0);
        for (const s of sparks) {
          for (let i = 0; i < s.size; i++) for (let j = 0; j < s.size; j++) cell(s.x + i, s.y + j, colors.accent, s.life * 0.5, (1 - s.life) * 6);
        }
        if (hidden) return;
        body.forEach(([x, y], i) => {
          cell(x, y, i === 0 ? colors.accent : colors.ink, (playing ? 1 : 0.55) * (1 - (i / body.length) * 0.6));
        });
      },
    };
  })();

  // ---- Chomp: a maze carved out of the grid. Clear every dot, keep away from the blocks.
  // A Litepod logo turns the tables for a while: the blocks turn blue and run, and
  // eating one freezes the game on its points while its eyes head back home.
  const chomp = (() => {
    const POWER = 45, SCARED = '#3b6cff';
    let open, dots, pods, me, dir, want, chasers, tick, power, combo, freeze, pops;
    const key = (x, y) => y * cols + x;
    const isOpen = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows && open[key(x, y)];
    // Breadth-first search; returns the first step toward the nearest cell `goal` accepts.
    function route(from, goal, blocked) {
      const seen = new Map([[key(...from), null]]);
      const queue = [from];
      while (queue.length) {
        const [x, y] = queue.shift();
        if (goal(x, y) && (x !== from[0] || y !== from[1])) {
          let k = key(x, y), prev;
          while ((prev = seen.get(k)) !== null && prev.k !== key(...from)) k = prev.k;
          return prev ? prev.d : null;
        }
        for (const [d, [dx, dy]] of Object.entries(DIRS)) {
          const nx = x + dx, ny = y + dy, nk = key(nx, ny);
          if (!isOpen(nx, ny) || seen.has(nk) || blocked(nx, ny)) continue;
          seen.set(nk, { k: key(x, y), d });
          queue.push([nx, ny]);
        }
      }
      return null;
    }
    function maze() {
      open = new Array(cols * rows).fill(false);
      const maxX = cols - 2 - ((cols - 2) % 2 === 0 ? 1 : 0), maxY = rows - 2 - ((rows - 2) % 2 === 0 ? 1 : 0);
      const stack = [[1, 1]];
      open[key(1, 1)] = true;
      while (stack.length) {
        const [x, y] = stack[stack.length - 1];
        const next = Object.values(DIRS).map(([dx, dy]) => [x + dx * 2, y + dy * 2, x + dx, y + dy])
          .filter(([nx, ny]) => nx >= 1 && ny >= 1 && nx <= maxX && ny <= maxY && !open[key(nx, ny)]);
        if (!next.length) { stack.pop(); continue; }
        const [nx, ny, wx, wy] = next[rand(next.length)];
        open[key(nx, ny)] = open[key(wx, wy)] = true;
        stack.push([nx, ny]);
      }
      // Knock out some walls so there are loops to escape through.
      for (let y = 1; y <= maxY; y++) for (let x = 1; x <= maxX; x++) {
        if (open[key(x, y)] || Math.random() > 0.3) continue;
        if ((isOpen(x - 1, y) && isOpen(x + 1, y)) || (isOpen(x, y - 1) && isOpen(x, y + 1))) open[key(x, y)] = true;
      }
      dots = new Set();
      for (let i = 0; i < open.length; i++) if (open[i]) dots.add(i);
      // Start in the middle: cells with odd coordinates are always carved out.
      me = [Math.floor(maxX / 2) | 1, Math.floor(maxY / 2) | 1];
      dots.delete(key(...me));
      // One logo in each quarter of the maze, on the open cell closest to its centre.
      pods = new Set();
      for (const [fx, fy] of [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]]) {
        const tx = maxX * fx, ty = maxY * fy;
        let best = null, bestDistance = Infinity;
        for (const k of dots) {
          const distance = Math.abs((k % cols) - tx) + Math.abs(Math.floor(k / cols) - ty);
          if (distance < bestDistance) { best = k; bestDistance = distance; }
        }
        if (best !== null) { dots.delete(best); pods.add(best); }
      }
      dir = want = 'right';
      const corners = [[maxX, maxY], [maxX, 1], [1, maxY]];
      chasers = corners.slice(0, cols > 30 ? 3 : 2).map(([x, y]) => ({ x, y, home: [x, y], dir: 'left', scared: false, eyes: false }));
      tick = 0;
      power = 0;
      freeze = 0;
      pops = [];
    }
    const near = (x, y, r, which) => chasers.some((c) => which(c) && Math.abs(c.x - x) + Math.abs(c.y - y) <= r);
    const hunting = (c) => !c.eyes && !c.scared;
    // Meeting a block ends the run; a scared one is eaten instead: each one in the
    // same logo is worth double, and the game holds still on its points for a moment.
    function meet() {
      for (const c of chasers) {
        if (c.eyes || c.x !== me[0] || c.y !== me[1]) continue;
        if (!c.scared) return true;
        c.scared = false;
        c.eyes = true;
        combo *= 2;
        score(combo);
        pops.push({ x: c.x, y: c.y, text: combo, life: 1 });
        freeze = 5;
      }
      return false;
    }
    function moveChaser(c) {
      if (c.eyes) {
        // Eyes go straight home, then the block comes back to life.
        if (c.x === c.home[0] && c.y === c.home[1]) return void (c.eyes = false);
        const d = route([c.x, c.y], (x, y) => x === c.home[0] && y === c.home[1], () => false);
        if (d) { c.dir = d; c.x += DIRS[d][0]; c.y += DIRS[d][1]; }
        return;
      }
      const choices = Object.keys(DIRS).filter((d) => !opposite(d, c.dir) && isOpen(c.x + DIRS[d][0], c.y + DIRS[d][1]));
      let d = null;
      if (c.scared) {
        // Running scared: the open step that ends farthest from you.
        d = choices.sort((a, b) => {
          const far = (k) => Math.abs(c.x + DIRS[k][0] - me[0]) + Math.abs(c.y + DIRS[k][1] - me[1]);
          return far(b) - far(a);
        })[0];
      } else if (Math.random() < 0.7) {
        d = route([c.x, c.y], (x, y) => x === me[0] && y === me[1], () => false);
      }
      if (!d) d = choices.length ? choices[rand(choices.length)] : Object.keys(DIRS).find((k) => opposite(k, c.dir));
      c.dir = d;
      c.x += DIRS[d][0];
      c.y += DIRS[d][1];
    }
    return {
      name: 'chomp',
      unit: 2,
      keys: 'arrows',
      accepts: (a) => a in DIRS,
      interval: () => (playing ? 120 : 150),
      reset: maze,
      input(next) { want = next; },
      step() {
        if (freeze) return void freeze--;
        if (!playing) {
          const food = (x, y) => dots.has(key(x, y)) || pods.has(key(x, y));
          want = (power > 8 && route(me, (x, y) => near(x, y, 0, (c) => c.scared), () => false))
            || route(me, food, (x, y) => near(x, y, 1, hunting))
            || route(me, food, () => false) || dir;
        }
        if (isOpen(me[0] + DIRS[want][0], me[1] + DIRS[want][1])) dir = want;
        if (isOpen(me[0] + DIRS[dir][0], me[1] + DIRS[dir][1])) {
          me = [me[0] + DIRS[dir][0], me[1] + DIRS[dir][1]];
        }
        if (dots.delete(key(...me))) score();
        if (pods.delete(key(...me))) {
          power = POWER;
          combo = 5;
          chasers.forEach((c) => { c.scared = !c.eyes; });
          score(5);
        }
        if (meet()) return die();
        // The blocks move two steps out of three, only every other step while scared,
        // and their eyes on every step.
        tick++;
        for (const c of chasers) if (c.eyes || (c.scared ? tick % 2 : tick % 3)) moveChaser(c);
        if (meet()) return die();
        if (power && --power === 0) chasers.forEach((c) => { c.scared = false; });
        if (!dots.size) { score(10); maze(); }
      },
      draw(time, hidden) {
        // Corridors are drawn in the page colour, so the walls are the grid itself.
        ctx.globalAlpha = 1;
        ctx.fillStyle = colors.ground;
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          if (open[key(x, y)]) ctx.fillRect(x * U, y * U, U + GAP, U + GAP);
        }
        for (const k of dots) dot(k % cols, Math.floor(k / cols), colors.ink, 0.3, 4);
        for (const k of pods) logo(k % cols, Math.floor(k / cols), 0.7 + 0.3 * Math.sin(time / 200));
        // Scared blocks turn blue and flash white when the logo is about to wear off;
        // eaten ones are just a pair of eyes on their way home.
        const flash = power <= 10 && Math.floor(time / 150) % 2;
        for (const c of chasers) {
          if (c.eyes) {
            dot(c.x - 0.2, c.y - 0.1, colors.ink, 0.9, 4);
            dot(c.x + 0.2, c.y - 0.1, colors.ink, 0.9, 4);
          } else if (c.scared) cell(c.x, c.y, flash ? colors.ink : SCARED, 0.9);
          else cell(c.x, c.y, colors.ink, 0.85);
        }
        // The points of an eaten block float up where it was.
        pops = pops.filter((p) => (p.life -= 0.015) > 0);
        ctx.font = '700 11px ui-monospace, "SF Mono", Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const p of pops) {
          ctx.globalAlpha = Math.min(1, p.life * 2);
          ctx.fillStyle = SCARED;
          ctx.fillText(p.text, (p.x + 0.5) * U, (p.y + 0.5) * U - (1 - p.life) * U);
        }
        // Like the arcade, you vanish while the game holds on the points.
        if (hidden || freeze) return;
        // While a logo is active you are the logo.
        if (power) logo(me[0], me[1], 1);
        else cell(me[0], me[1], colors.accent, 0.75 + 0.25 * Math.sin(time / 120));
      },
    };
  })();

  // ---- Runner: the Litepod pod jumps over stacks of blocks that get faster.
  const runner = (() => {
    const ARC = [1, 2, 3, 4, 4, 4, 4, 3, 2, 1];
    const X = 4;
    let air, wantJump, blocks, gap, passed;
    const groundRow = () => Math.max(6, Math.floor(rows * 0.8));
    const lift = (a) => (a < 0 ? 0 : ARC[a]);
    const hits = (a, list) => {
      const e = lift(a);
      return list.some((b) => b.x < X + 2 && b.x + b.w > X && e < b.h);
    };
    // Plays the next ticks with a jump at tick `at` and says whether the pod clears
    // the nearest stack; the ones after it get their own jump.
    function clears(at) {
      const next = blocks.find((b) => b.x + b.w > X);
      if (!next) return true;
      const b = { ...next };
      let a = air;
      while (b.x + b.w > X) {
        if (at-- === 0 && a < 0) a = 0;
        else if (a >= 0 && ++a >= ARC.length) a = -1;
        b.x--;
        if (hits(a, [b])) return false;
      }
      return true;
    }
    return {
      name: 'runner',
      unit: 2,
      keys: 'jump',
      accepts: (a) => a === 'jump' || a === 'up',
      interval: () => (playing ? Math.max(42, 80 - passed * 1.5) : 80),
      reset() {
        air = -1;
        wantJump = false;
        blocks = [];
        gap = 8;
        passed = 0;
      },
      input() { wantJump = true; },
      step() {
        // Attract mode jumps at the last moment that still clears what is ahead.
        if (!playing && air < 0 && clears(0) && !clears(1)) wantJump = true;
        if (wantJump && air < 0) air = 0;
        else if (air >= 0 && ++air >= ARC.length) air = -1;
        wantJump = false;
        blocks.forEach((b) => b.x--);
        blocks = blocks.filter((b) => {
          if (b.x + b.w === X) { passed++; score(); }
          return b.x + b.w > 0;
        });
        if (--gap <= 0) {
          blocks.push({ x: cols, w: 1 + rand(2), h: 1 + rand(3) });
          // Never closer than one jump plus a step, so every stack can be cleared.
          gap = ARC.length + 4 + rand(12);
        }
        if (hits(air, blocks)) die();
      },
      draw(time, hidden) {
        const g = groundRow();
        for (let x = 0; x < cols; x++) cell(x, g, colors.ink, 0.14);
        for (const b of blocks) {
          for (let i = 0; i < b.w; i++) for (let j = 0; j < b.h; j++) cell(b.x + i, g - 1 - j, colors.ink, 0.8);
        }
        if (hidden) return;
        const e = lift(air);
        for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) cell(X + i, g - 1 - e - j, colors.accent, playing ? 1 : 0.7);
      },
    };
  })();

  const games = { snake, chomp, runner };
  // `#snake`, `#chomp` or `#runner` in the URL picks one; otherwise it is a surprise.
  game = games[location.hash.slice(1)] || Object.values(games)[rand(3)];

  const hintText = document.getElementById('hint-text');
  const hintKeys = document.getElementById('hint-keys');
  if (game.keys === 'jump') {
    hintText.textContent = touch
      ? (es ? 'Juega mientras esperas: toca la cuadrícula para saltar' : 'Play while you wait: tap the grid to jump')
      : (es ? 'Juega mientras esperas: salta con' : 'Play while you wait: jump with');
    if (!touch) hintKeys.innerHTML = '<kbd>Space</kbd> <kbd>↑</kbd>';
  } else {
    hintText.textContent = touch
      ? (es ? 'Juega mientras esperas: desliza sobre la cuadrícula' : 'Play while you wait: swipe on the grid')
      : (es ? 'Juega mientras esperas:' : 'Play while you wait:');
    if (!touch) hintKeys.innerHTML = '<kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd>';
  }
  try { best = Number(localStorage.getItem(`litepod-best-${game.name}`)) || 0; } catch {}
  bestEl.textContent = best;

  function readColors() {
    const css = getComputedStyle(document.documentElement);
    colors = Object.fromEntries(['ink', 'accent', 'ground'].map((k) => [k, css.getPropertyValue(`--${k}`).trim()]));
  }
  function start(asPlayer) {
    playing = asPlayer;
    dead = 0;
    points = 0;
    pointsEl.textContent = 0;
    game.reset();
  }
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const { width, height } = board.getBoundingClientRect();
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // The game takes everything above the text; below it the grid fades out.
    U = SIZE * game.unit;
    const play = Math.max(9 * U, document.querySelector('main section').getBoundingClientRect().top - 24);
    board.style.setProperty('--play', `${play}px`);
    // Snake also roams the faded band, down to where the grid turns black (+9rem, as in the CSS mask).
    const fade = game.name === 'snake' ? 9 * parseFloat(getComputedStyle(document.documentElement).fontSize) : 0;
    const next = [Math.floor(width / U), Math.floor((play + fade) / U)];
    // A phone's toolbar resizes the page while scrolling; a game in progress survives that.
    if (next[0] !== cols || next[1] !== rows) {
      [cols, rows] = next;
      start(false);
    }
    draw(0);
  }
  function draw(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    game.draw(time, dead > 0 && dead % 2 === 0);
    ctx.globalAlpha = 1;
  }
  function loop(time) {
    if (time - last >= game.interval()) {
      last = time;
      if (dead) { if (--dead === 0) start(false); }
      else game.step();
    }
    draw(time);
    requestAnimationFrame(loop);
  }
  function run() {
    if (running) return;
    running = true;
    requestAnimationFrame(loop);
  }
  function input(action) {
    if (!game.accepts(action)) return false;
    if (!playing || dead) start(true);
    game.input(action);
    run();
    return true;
  }

  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', ' ': 'jump' };
  addEventListener('keydown', (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const action = KEYS[event.key] || KEYS[event.key.toLowerCase()];
    if (action && input(action)) event.preventDefault();
  });
  let pointer = null;
  board.addEventListener('pointerdown', (e) => { pointer = [e.clientX, e.clientY]; });
  board.addEventListener('pointerup', (e) => {
    if (!pointer) return;
    const dx = e.clientX - pointer[0], dy = e.clientY - pointer[1];
    pointer = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return void input('jump');
    input(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  // Every 10 seconds ask for this same address again. Litepod serves this page for
  // as long as maintenance is on, so an answer without the litepod-maintenance meta
  // (whatever its status) means it was turned off: offer to go there, and go on our
  // own after 5 seconds unless cancelled.
  const back = document.getElementById('back');
  const backText = document.getElementById('back-text');
  const backGo = document.getElementById('back-go');
  const backCancel = document.getElementById('back-cancel');
  backGo.textContent = es ? 'Ir ahora' : 'Go now';
  backCancel.textContent = es ? 'Seguir jugando' : 'Keep playing';
  let checking = true, countdown = null;
  function announce(seconds) {
    backText.textContent = es ? `El sitio ya volvió. Te llevamos en ${seconds} s` : `The site is back. Taking you there in ${seconds}s`;
  }
  async function check() {
    if (!checking || document.hidden) return;
    try {
      const res = await fetch(location.href, { cache: 'no-store', credentials: 'same-origin' });
      if (!checking || (await res.text()).includes('name="litepod-maintenance"')) return;
    } catch { return; }
    checking = false;
    let left = 5;
    announce(left);
    back.hidden = false;
    countdown = setInterval(() => {
      if (--left <= 0) location.reload();
      else announce(left);
    }, 1000);
  }
  backGo.addEventListener('click', () => location.reload());
  backCancel.addEventListener('click', () => {
    clearInterval(countdown);
    back.hidden = true;
  });
  setInterval(check, 10000);

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
  addEventListener('resize', resize);
  readColors();
  resize();
  // With reduced motion there is no attract mode: the board waits for a player.
  if (!reduced) run();
})();
</script>
</body>
</html>
