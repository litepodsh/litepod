<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Your Litepod verification code</title>
</head>
<body style="margin:0;padding:0;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0f0f0f;">
<div style="display:none;max-height:0;overflow:hidden;">Enter this code to confirm your email. It expires in 2 hours.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fafafa;">
<tr><td align="center" style="padding:32px 16px;">
  <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border:1px solid #e6e6e6;border-radius:12px;">
    <tr><td style="padding:32px 32px 0;font-size:18px;font-weight:700;color:#d4410b;">Litepod</td></tr>
    <tr><td style="padding:24px 32px 0;font-size:24px;font-weight:700;line-height:1.3;color:#0f0f0f;">Confirm your email</td></tr>
    <tr><td style="padding:12px 32px 0;font-size:16px;line-height:1.6;color:#5e5e5e;">Enter this code on the verification page.</td></tr>
    <tr><td style="padding:24px 32px 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fafafa;border:1px solid #e6e6e6;border-radius:8px;">
        <tr><td align="center" style="padding:20px 8px 20px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#0f0f0f;">{{code}}</td></tr>
      </table>
    </td></tr>
    <tr><td style="padding:16px 32px 0;font-size:14px;line-height:1.6;color:#5e5e5e;">It expires in 2 hours.</td></tr>
    <tr><td style="padding:24px 32px 32px;font-size:14px;line-height:1.6;color:#5e5e5e;">If you didn't ask for this code, you can safely ignore this email.</td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
