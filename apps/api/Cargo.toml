[package]
name = "litepod-api"
version = "0.1.0"
edition = "2024"

# Debug builds compile dependencies unoptimized too, which makes the compression and
# crypto crates (zlib-rs behind flate2, libgit2, openssl) an order of magnitude slower
# - enough to pin a core for minutes while tarring a build context or cloning a repo.
# Optimizing only dependencies keeps `cargo build` on our own code fast.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
debug = false   

[dependencies]
aes-gcm = "0.10"
ammonia = "4"
async-stream = "0.3"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["tokio", "ws", "multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie"] }
axum-prometheus = "0.10.0"
base64 = "0.22.1"
bcrypt = "0.16"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
cookie = "0.18.1"
duckdb = { version = "1.10506.0", features = ["bundled"] }
croner = "3.0.1"
dotenvy = "0.15.7"
futures-util = "0.3.32"
git2 = "0.20"
governor = "0.7"
hmac = "0.13.0"
hex = "0.4"
ipnet = "2"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
libc = "0.2"
podman-api = "0.11.0"
prometheus = "0.14.0"
rand = "0.10.2"
rust-argon2 = "3.0.0"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"], default-features = false }
# rig's HTTP client is reqwest 0.13 (already in the tree through rig). Named here
# only so the assistant can hand rig a client built with `redirect::Policy::none()`
# (see `assistant::providers::http_client`); no features of its own.
reqwest013 = { package = "reqwest", version = "0.13", default-features = false }
# Both `ring` and `aws-lc-rs` land in the dependency tree (reqwest,
# rustls-platform-verifier, ...), so rustls can't auto-select a process-wide crypto
# provider. We install one explicitly at boot (see `main.rs`) — direct dep only so
# that call site can reference `rustls::crypto`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sentry = { version = "0.49", features = ["tracing"] }
sentry-tower = { version = "0.49", features = ["http", "axum", "axum-matched-path"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9"
similar = "2"
sha2 = "0.11.0"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "uuid"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["compat", "io"] }
toml = "1.1.2"
tar = "0.4"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
urlencoding = "2.1.3"
zip = "8.6.0"
sevenz-rust2 = { version = "0.21", features = ["compress"] }
totp-rs = { version = "5.7.2", features = ["gen_secret", "otpauth"] }
openssl = { version = "0.10.81", features = ["vendored"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono", "debug"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.23.4", features = ["v4", "v7", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "1"
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls"] }
redis = { version = "1.6", features = ["tokio-comp", "connection-manager"] }
portable-pty = "0.9.0"
rig = { version = "=0.42.0", default-features = false, features = ["reqwest", "agent", "derive", "rustls"] }
openidconnect = "4"
hickory-resolver = "0.26"
samael = { version = "0.0.22", optional = true }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[features]
# SAML 2.0 SSO (spec 3, phase 7). Off by default: `samael` needs native libxml2 +
# xmlsec1 (macOS: `brew install libxmlsec1 pkgconf`; Debian: `libxmlsec1-dev pkg-config`).
saml = ["dep:samael"]
