# cargo-audit exceptions. Policy: every
# entry names one advisory, explains why it is not reachable, and has a review date.
# No blanket ignores.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — `rsa` 0.9 "Marvin attack": non-constant-time *private-key*
    # operations (decryption/signing) can leak the key through timing. No patched
    # version exists. Reachability: the only remaining path is `openidconnect`, which
    # uses `rsa` to *verify* IdP ID-token signatures with the IdP's public key; we
    # never load an RSA private key through it. Our one RSA private-key operation
    # (the GitHub App JWT) signs through `jsonwebtoken` with the `aws_lc_rs` backend
    # (constant time), not this crate. The OIDC routes do not exist on cloud.
    # Review by 2027-01-07, or as soon as `rsa` 0.10 ships and `openidconnect` adopts it.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0459 (CVE-2026-119375) — `libsqlite3-sys` 0.30 bundles SQLite < 3.54:
    # opening a database together with a `-wal` file whose page size differs can return
    # uninitialized memory. Local vector; needs a crafted db + wal pair. Reachability:
    # we only open our own database at DATABASE_PATH. Backup restore replays a SQL text
    # dump into that database (src/backup/restore.rs); it never opens a foreign SQLite
    # file or `-wal`, and nothing uses ATTACH. An attacker would already need write
    # access to the data volume. The fix needs `libsqlite3-sys` >= 0.39, but
    # `sqlx-sqlite` 0.9.0 pins `>=0.30.1, <0.38.0`, so it cannot be taken until `sqlx`
    # widens that range.
    # Review by 2026-12-14, or as soon as a `sqlx` release allows `libsqlite3-sys` 0.39.
    "RUSTSEC-2026-0459",
]
