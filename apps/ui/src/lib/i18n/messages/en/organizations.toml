[sso.help]
about = "About {field}"
equivalents = "What your identity provider calls it"
name = "Only for telling connections apart in Litepod. It does not need to match anything in the IdP."
protocol = "OpenID Connect and SAML 2.0 do the same job: sign-in. Use OpenID Connect unless your IdP lacks it or your security team requires SAML. It cannot be changed after the connection is created."
issuer = "The IdP's base URL. Litepod reads its endpoints and signing keys from it. Must be HTTPS. In Entra it ends in /v2.0, with no trailing slash."
client_id = "The public identifier of the app you registered in the IdP. In Entra it is the Application (client) ID on Overview: not the Object ID nor the Secret ID."
client_secret = "That app's password. In Entra copy the secret's Value column, not the Secret ID; it is hidden once you leave the page and expires on its Expires date."
groups_claim = "The name of the token field that carries the user's groups. Litepod uses it for group mappings. Without groups, everyone gets the base role."
default_role = "The organization role everyone gets the first time they sign in through SSO. Extra permissions come from group mappings."
jit = "Just-in-time: if the person does not exist in Litepod, they are created on first sign-in. Unchecked, only existing users or users provisioned by SCIM can sign in."
enabled = "Only enabled connections are used at sign-in. Needs a verified domain, and each domain can have only one enabled connection."
idp_metadata = "The XML that describes the IdP: its sign-in URL and signing certificate. Paste the whole file. It must include the certificate; SHA-1 is rejected."
redirect_uri = "Where the IdP sends the user back after sign-in. Copy it into the IdP exactly, character for character, or the IdP returns an error (in Entra, AADSTS50011)."
session_ttl = "The longest a Litepod session from this identity provider lasts. Shorter means people removed from the IdP lose access sooner; signing in again is usually instant while the IdP session is alive. 60 is a good default."
post_logout_redirect_uri = "Where the identity provider sends the browser after Litepod signs the user out of it. Add it to the IdP's allowed logout URLs or the IdP shows an error. In Entra, also add auth_time as an optional ID token claim (Token configuration) so forced sign-ins can be verified."
backchannel_logout_url = "The identity provider calls this when an admin signs a user out or ends their sessions, and Litepod signs them out at once. In Keycloak, turn off 'Backchannel logout session required'. Entra and Okta do not support it; use SCIM instead."
acs_url = "Where the IdP posts the signed SAML response. Copy it into the IdP exactly."
sp_entity_id = "Litepod's identifier for this IdP. Copy it into the IdP; it must match exactly or the IdP reports the application does not exist."
external_group = "The group's identifier as the IdP sends it in the groups claim. Entra sends Object IDs, not names."
tenant_url = "The URL the IdP sends creations, deactivations and group changes to (SCIM). It must be reachable from the internet over HTTPS."
secret_token = "The token the IdP authenticates with when calling SCIM. Shown only once; generating a new one invalidates the old one."

