[privacy]
account_data = "3. Account data"
account_email = "— used to sign in, verify your account, and send account-related emails (password resets, security alerts)."
account_intro = "When you register, we store:"
account_password = "— stored as a salted hash; we never store or can see your plain-text password."
account_two_factor = "If you enable two-factor authentication, we store what's needed to verify your 2FA codes."
account_username = "— used to identify you inside the app."
analytics = "6. Analytics and cookies"
analytics_description = "We use a session cookie to keep you signed in. We also use usage analytics (Umami and OpenPanel) purely to improve performance and reduce errors — this includes page views, web vitals (load time, layout stability, responsiveness), and, through OpenPanel's session replay, recordings of on-screen interactions that help us find and fix bugs. This analytics data is not linked to your account credentials and is never used for advertising or sold to third parties. You can opt out by blocking analytics scripts with your browser or an extension; doing so does not affect your ability to use the Service."
changes = "12. Changes to this policy"
changes_description = "We may update this policy from time to time. If we make material changes, we'll update the \"Last updated\" date above and, where appropriate, notify you."
contact = "13. Contact"
contact_description = "Questions about this policy or your data? Contact us at"
controller = "1. Who we are"
controller_description = "litepod is operated by Litepod Studio, the controller of the personal data described in this policy. For any privacy question, request, or complaint, contact us at info@litepod.sh."
data_sharing = "8. Data sharing and international transfers"
data_sharing_description = "We share data with third parties only where necessary to run the Service: Polar for payment processing, billing support and refunds, our analytics providers (Umami and OpenPanel) as described above, and the infrastructure providers that host the Service. Some of these providers may process data outside your country; where they do, we rely on standard contractual clauses or another lawful transfer mechanism. We don't sell or rent your personal data to anyone else."
overview = "2. Overview"
overview_description = "litepod collects the data needed to run your account and the deployments you manage with it: your account details (email address, username and a securely hashed password), your billing status, and the configuration and logs of your services, all described below. We don't sell it and we don't use it for advertising."
payment_data = "5. Payment data"
payment_description = "If you subscribe to a paid plan, billing is handled by Polar, our payment processor and, where applicable, merchant of record. Polar collects and processes your payment details (card number, billing address, etc.) directly — litepod does not receive or store your full payment card information. We only keep a reference to your subscription status so we can enable the features you've paid for, and we share the billing data Polar needs to process payments, invoices and refunds. Polar acts as an independent controller for the data it collects; see Polar's own privacy policy at polar.sh/legal/privacy for how they handle payment data."
privacy_policy = "Privacy Policy"
retention = "9. Data retention and deletion"
retention_description = "We keep your account data for as long as your account is active, billing records for as long as tax and accounting rules require, and operational logs and analytics for a limited period (typically up to 90 days). You can request deletion of your account and associated data at any time by contacting us; we'll delete it except where we're required to keep records (e.g. billing history) for legal reasons."
rights = "11. Your rights"
rights_description = "Depending on where you live, you can access, correct, delete, or export your personal data, object to or restrict how we process it, and withdraw consent you have given (for example for analytics). You can update your email and username from your account settings at any time; for anything else, email info@litepod.sh and we will respond within 30 days. You also have the right to complain to your local data protection authority."
security = "10. Security"
security_description = "We use industry-standard measures to protect your data, including password hashing and encrypted connections (TLS). No method of transmission or storage is 100% secure, but we work to protect your information."
sell_data = "We do not sell your data."
service_data = "4. Data you store in the Service"
service_data_description = "To run your deployments the Service stores what you configure in it: server addresses and the SSH keys used to reach them, Git provider connections and tokens, environment variables and secrets, domain names and certificates, S3 backup credentials, deployment and container logs, metrics, and an audit log of actions in your organizations. Credentials are encrypted at rest. This data belongs to your organization: it is visible only to members with the right permissions, and to us only when needed to provide support or keep the Service secure. Logs and audit records are kept for a limited time and are deleted together with your organization."
use_data = "7. How we use your data"
use_data_1 = "To create and secure your account, and let you log in."
use_data_2 = "To send you account and billing-related emails."
use_data_3 = "To provide support when you ask for it."
use_data_4 = "To keep the Service reliable and secure, and to improve it."

[terms]
acceptance = "1. Acceptance of terms"
acceptance_description = "By creating an account or otherwise using litepod (\"the Service\"), you agree to these Terms of Service. If you do not agree, do not use the Service."
accounts = "3. Accounts"
accounts_description = "You need an account to use litepod. An account requires an email address and a username, and is protected by a password (and, optionally, two-factor authentication). You are responsible for keeping your credentials confidential and for all activity that happens under your account. Tell us right away if you suspect unauthorized access."
availability = "14. Availability and warranty disclaimer"
availability_description = "The Service is provided \"as is\" and \"as available,\" without warranties of any kind, express or implied. We do not guarantee that the Service will be uninterrupted, secure, or error-free."
backups = "12. Backups"
backups_description = "Database backups are written to S3-compatible storage that your organization configures; litepod does not keep its own copy of your application data. You are responsible for that storage account, for checking that backups succeed, and for testing restores. We are not liable for data lost because a backup was not configured, failed, or was removed from your storage."
changes = "20. Changes to these terms"
changes_description = "We may update these terms from time to time. If we make material changes, we'll update the \"Last updated\" date above and, where appropriate, notify you."
company_information = "19. Company information"
company_information_description = "litepod is operated by Litepod Studio. For legal notices, billing questions, refunds, or data requests, contact us at info@litepod.sh."
complaints = "18. Complaints and dispute resolution"
complaints_description = "If something went wrong, email info@litepod.sh with \"Complaint\" in the subject line. We acknowledge every complaint within 2 business days and aim to resolve it within 14 days. If you are not satisfied with our response, you can escalate the matter to your local consumer protection authority or trade ombudsman, or to the European Commission's online dispute resolution service."
contact = "21. Contact"
contact_description = "Questions about these terms? Contact us at"
content = "8. Your content and deployments"
content_description = "You retain ownership of the code, images, and data you deploy through litepod. You are solely responsible for that content and for having the rights necessary to deploy it."
data_processing = "11. Personal data in your applications"
data_processing_description = "Your applications may process personal data about your own users. For that data you are the controller and litepod acts only as a processor: we process it only to provide the Service on your instructions, keep it confidential, protect it with appropriate security measures, use subprocessors only as described in our Privacy Policy, and help you answer data subject requests where the Service makes that possible. You are responsible for having a lawful basis for that processing and for informing your users. If you need a signed data processing agreement, contact us."
indemnity = "16. Indemnification"
indemnity_description = "You agree to indemnify litepod against third-party claims arising from the content you deploy, from your use of the Service in breach of these terms or the Acceptable Use Policy, or from your violation of the law or of third-party rights."
liability = "15. Limitation of liability"
liability_description = "To the maximum extent permitted by law, litepod will not be liable for any indirect, incidental, or consequential damages arising from your use of the Service."
merchant_of_record = "6. Merchant of record"
merchant_of_record_description = "Our order process is conducted by our online reseller Polar.sh. Polar.sh is the Merchant of Record for all our orders. Polar provides all customer service inquiries and handles returns."
refund_cancellations = "Cancellations, renewals and later requests"
refund_how = "How to request a refund"
refund_policy = "5. Refund policy"
refund_policy_description = "We offer a 30-day money-back guarantee. If you are not satisfied with litepod for any reason, contact us within 30 days of your purchase or of your most recent renewal and we will refund the full amount paid for that period. No conditions, no questions asked, and no fees withheld."
refund_policy_how = "To request a refund, email info@litepod.sh from the email address on your account, or open the Polar customer portal from your subscription settings and request it there. Refunds are issued by Polar.sh, our merchant of record, to your original payment method."
refund_policy_renewals = "Cancelling stops future charges but is not a refund by itself: your access continues until the end of the billing period you already paid for. Requests made after the 30-day window are still reviewed case by case, and nothing in this policy limits any refund rights you have under applicable consumer law."
security = "10. Shared security responsibility"
security_description = "Security is shared between us. We protect the litepod control plane, encrypt stored credentials (SSH keys, Git tokens, environment variables and S3 keys) at rest, and keep each organization's data separate from every other organization. You are responsible for your account credentials and two-factor authentication, for who you invite to your organizations and the roles you give them, for the code, images and dependencies you deploy, for the secrets you configure, and for keeping your servers updated. Tell us right away at info@litepod.sh if you suspect that your account or a connected server has been compromised."
servers = "9. Your servers and the access you grant"
servers_description = "When you connect a server, you give litepod an SSH key that lets the Service sign in to that server and run commands on it: install and update software, build and run containers, configure the reverse proxy, and read logs and metrics. The Service uses this access only to do what you ask and to keep your deployments running. You must own the server or be authorized to grant this access. You can revoke it at any time by removing the server from litepod and deleting its key from the server. You remain responsible for the server itself: your contract with its provider, its operating system, its firewall, and anything you run on it outside litepod."
subscriptions = "4. Subscriptions and payments"
subscriptions_cancellation = "You can cancel a subscription at any time from your account settings or from the Polar customer portal. Cancellation takes effect at the end of the billing period you already paid for and stops all future charges — you keep access until then. Fees already billed are refunded as described in section 5."
subscriptions_description = "Some features are offered as paid subscriptions. Payments are processed by Polar, our payment processor and, where applicable, merchant of record. When you subscribe, you authorize Polar to charge your chosen payment method on a recurring basis, monthly or annually depending on the interval you pick, until you cancel. Your subscription renews automatically at the start of each billing period, and we will notify you in advance of any change to the price or the billing interval. litepod does not receive or store your full card details — those are handled directly by Polar, subject to Polar's own terms and privacy policy."
suspension = "13. Suspension"
suspension_description = "We may suspend all or part of the Service for your account without prior notice when this is necessary to prevent harm: a security incident, an attack coming from or aimed at your deployments, a breach of the Acceptable Use Policy that is causing harm, a legal requirement, or non-payment after the grace period. When we can, we will tell you the reason, and we will restore the Service once the cause has been resolved."
termination = "17. Termination"
termination_description = "You may stop using the Service and delete your account at any time. We may suspend or terminate accounts that violate these terms or applicable law."
terms_of_service = "Terms of Service"
use = "7. Acceptable use"
use_description = "You must follow our Acceptable Use Policy, which is part of these terms. In short: no unlawful, infringing or malicious content, no attacks on other people or on the Service, and no circumventing usage limits or security controls. We may suspend or terminate accounts that violate it."
what_is = "2. What litepod is"
what_is_description = "litepod is a platform for deploying and managing applications on your own infrastructure or on a hosted instance. It lets you connect a Git repository or other source, build it, and run it as a container-based deployment."

