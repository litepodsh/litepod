[acceptable_use]
activities = "3. Prohibited activities"
activities_description = "Do not use the Service to: send spam or unsolicited bulk messages; attack, scan or probe systems you are not authorized to test, including denial-of-service attacks and brute-force logins; run botnets, command-and-control servers, or open proxies and relays that others use for abuse; mine cryptocurrency on servers provided by litepod; sell, share or resell accounts to get around limits or bans; get around usage limits, billing, or security controls; or break sanctions, export controls or other applicable law."
changes = "8. Changes to this policy"
changes_description = "We may update this policy. If we make material changes, we will update the \"Last updated\" date above and, where appropriate, notify you."
content = "2. Prohibited content"
content_description = "Do not deploy, host, store or distribute through the Service: child sexual abuse material (we report it to the authorities and close the account immediately); malware, ransomware or exploit kits aimed at systems you do not own; phishing pages or sites that impersonate other people or organizations; content that infringes copyright, trademarks or other rights; content that promotes terrorism or incites violence; intimate images shared without consent; personal data of others published to harass or expose them; or any other content that is illegal where you or your users are."
enforcement = "7. Enforcement"
enforcement_description = "We may investigate suspected violations, and depending on how serious they are we may warn you, remove a route or stop a deployment, suspend your account, or close it. When there is imminent harm (illegal content, an active attack, a security incident) we act first and tell you afterwards. Accounts closed for serious or repeated violations are not entitled to a refund, except where the law requires one. We cooperate with law enforcement when the law requires it."
platform = "4. Testing the platform"
platform_description = "Do not probe, scan, load-test or try to break the litepod control plane or other customers' resources. If you find a vulnerability, report it privately to info@litepod.sh with \"Security report\" in the subject. Do not access or change data that is not yours, and give us reasonable time to fix the issue before disclosing it. We will not take action against good-faith research that follows these rules."
reporting = "6. Reporting abuse"
reporting_description = "To report abuse coming from a deployment on litepod, email info@litepod.sh with \"Abuse report\" in the subject. Include the URL, domain or IP address, the date and time (with timezone), and any evidence such as logs, headers or screenshots. We acknowledge reports within 2 business days."
responsibility = "5. Your responsibilities"
responsibility_description = "Keep the software you deploy and the servers you connect updated, protect your credentials and secrets, and answer abuse reports we forward to you within 48 hours. If one of your applications is compromised, take it offline or fix it and tell us what happened."
scope = "1. Scope"
scope_description = "This policy is part of our Terms of Service. It applies to everyone who uses litepod Cloud and to everything deployed through it, whether it runs on a server you connect or on one we provide. You are responsible for the activity of the people you invite to your organizations and of the applications you run."
title = "Acceptable Use Policy"

