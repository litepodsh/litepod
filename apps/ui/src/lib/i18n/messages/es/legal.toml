[acceptable_use]
activities = "3. Actividades prohibidas"
activities_description = "No uses el Servicio para: enviar spam o mensajes masivos no solicitados; atacar, escanear o sondear sistemas que no estás autorizado a probar, incluidos ataques de denegación de servicio y ataques de fuerza bruta a logins; operar botnets, servidores de comando y control, o proxies y relays abiertos que otros usan para abusar; minar criptomonedas en servidores que provee litepod; vender, compartir o revender cuentas para evadir límites o bloqueos; evadir límites de uso, la facturación o los controles de seguridad; ni violar sanciones, controles de exportación u otras leyes aplicables."
changes = "8. Cambios a esta política"
changes_description = "Podemos actualizar esta política. Si hacemos cambios importantes, actualizaremos la fecha de \"Última actualización\" de arriba y, cuando corresponda, te avisaremos."
content = "2. Contenido prohibido"
content_description = "No despliegues, alojes, guardes ni distribuyas a través del Servicio: material de abuso sexual infantil (lo denunciamos a las autoridades y cerramos la cuenta de inmediato); malware, ransomware o kits de exploits dirigidos a sistemas que no son tuyos; páginas de phishing o sitios que suplantan a otras personas u organizaciones; contenido que infringe derechos de autor, marcas u otros derechos; contenido que promueve el terrorismo o incita a la violencia; imágenes íntimas compartidas sin consentimiento; datos personales de otros publicados para acosarlos o exponerlos; ni ningún otro contenido ilegal donde estés tú o tus usuarios."
enforcement = "7. Medidas que tomamos"
enforcement_description = "Podemos investigar los posibles incumplimientos y, según su gravedad, advertirte, quitar una ruta o detener un despliegue, suspender tu cuenta o cerrarla. Cuando hay un daño inminente (contenido ilegal, un ataque en curso, un incidente de seguridad) actuamos primero y te avisamos después. Las cuentas cerradas por incumplimientos graves o repetidos no tienen derecho a reembolso, salvo cuando la ley lo exija. Cooperamos con las autoridades cuando la ley lo exige."
platform = "4. Pruebas sobre la plataforma"
platform_description = "No sondees, escanees, hagas pruebas de carga ni intentes vulnerar el plano de control de litepod o los recursos de otros clientes. Si encuentras una vulnerabilidad, repórtala en privado a info@litepod.sh con \"Security report\" en el asunto. No accedas ni modifiques datos que no son tuyos, y danos un tiempo razonable para corregirla antes de publicarla. No tomaremos acciones contra investigaciones de buena fe que sigan estas reglas."
reporting = "6. Cómo reportar abuso"
reporting_description = "Para reportar abuso que proviene de un despliegue en litepod, escribe a info@litepod.sh con \"Abuse report\" en el asunto. Incluye la URL, el dominio o la dirección IP, la fecha y hora (con zona horaria) y cualquier evidencia, como logs, cabeceras o capturas de pantalla. Confirmamos la recepción de los reportes en un plazo de 2 días hábiles."
responsibility = "5. Tus responsabilidades"
responsibility_description = "Mantén actualizado el software que despliegas y los servidores que conectas, protege tus credenciales y secretos, y responde en un plazo de 48 horas a los reportes de abuso que te reenviemos. Si una de tus aplicaciones es comprometida, desconéctala o corrígela y cuéntanos qué pasó."
scope = "1. Alcance"
scope_description = "Esta política forma parte de nuestros Términos de servicio. Se aplica a todas las personas que usan litepod Cloud y a todo lo que se despliega a través de él, ya sea en un servidor que conectas tú o en uno que te damos nosotros. Eres responsable de la actividad de las personas que invitas a tus organizaciones y de las aplicaciones que ejecutas."
title = "Política de uso aceptable"

