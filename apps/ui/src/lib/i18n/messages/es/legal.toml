[privacy]
account_data = "3. Datos de la cuenta"
account_email = "— se usa para iniciar sesión, verificar tu cuenta y enviar correos relacionados con ella (restablecimientos de contraseña y alertas de seguridad)."
account_intro = "Cuando te registras, almacenamos:"
account_password = "— se almacena como un hash con sal; nunca almacenamos ni podemos ver tu contraseña en texto sin formato."
account_two_factor = "Si activas la autenticación de dos factores, almacenamos lo necesario para verificar tus códigos 2FA."
account_username = "— se usa para identificarte dentro de la aplicación."
analytics = "6. Análisis y cookies"
analytics_description = "Usamos una cookie de sesión para mantener tu sesión iniciada. También usamos análisis de uso (Umami y OpenPanel) únicamente para mejorar el rendimiento y reducir errores; esto incluye vistas de página, métricas web (tiempo de carga, estabilidad del diseño y capacidad de respuesta) y, mediante la repetición de sesiones de OpenPanel, grabaciones de interacciones en pantalla que nos ayudan a encontrar y corregir errores. Estos datos analíticos no están vinculados a las credenciales de tu cuenta y nunca se usan para publicidad ni se venden a terceros. Puedes excluirte bloqueando los scripts de análisis con tu navegador o una extensión; hacerlo no afecta tu uso del Servicio."
changes = "12. Cambios a esta política"
changes_description = "Podemos actualizar esta política de vez en cuando. Si hacemos cambios importantes, actualizaremos la fecha de \"Última actualización\" anterior y, cuando corresponda, te avisaremos."
contact = "13. Contacto"
contact_description = "¿Preguntas sobre esta política o tus datos? Contáctanos en"
controller = "1. Quiénes somos"
controller_description = "litepod es operado por Litepod Studio, responsable de los datos personales descritos en esta política. Para cualquier pregunta, solicitud o reclamación sobre privacidad, escríbenos a info@litepod.sh."
data_sharing = "8. Compartición de datos y transferencias internacionales"
data_sharing_description = "Compartimos datos con terceros solo cuando es necesario para operar el Servicio: Polar para el procesamiento de pagos, soporte de facturación y reembolsos, nuestros proveedores de análisis (Umami y OpenPanel) descritos anteriormente y los proveedores de infraestructura que alojan el Servicio. Algunos de estos proveedores pueden tratar datos fuera de tu país; cuando lo hacen, nos apoyamos en cláusulas contractuales estándar u otro mecanismo de transferencia legal. No vendemos ni alquilamos tus datos personales a nadie más."
overview = "2. Resumen"
overview_description = "litepod recopila los datos necesarios para operar tu cuenta y los despliegues que administras con ella: los datos de tu cuenta (correo, nombre de usuario y una contraseña guardada como hash seguro), el estado de tu facturación y la configuración y los logs de tus servicios, todo descrito más abajo. No los vendemos ni los usamos para publicidad."
payment_data = "5. Datos de pago"
payment_description = "Si te suscribes a un plan de pago, la facturación la gestiona Polar, nuestro procesador de pagos y, cuando corresponda, comerciante registrado. Polar recopila y procesa directamente tus datos de pago (número de tarjeta, dirección de facturación, etc.); litepod no recibe ni almacena la información completa de tu tarjeta. Solo conservamos una referencia al estado de tu suscripción para habilitar las funciones que pagaste y compartimos con Polar los datos de facturación necesarios para procesar pagos, facturas y reembolsos. Polar actúa como responsable independiente de los datos que recopila; consulta su política de privacidad en polar.sh/legal/privacy para saber cómo maneja los datos de pago."
privacy_policy = "Política de privacidad"
retention = "9. Retención y eliminación de datos"
retention_description = "Conservamos los datos de tu cuenta mientras esté activa, los registros de facturación durante el tiempo que exijan las normas fiscales y contables, y los registros operativos y analíticos por un período limitado (normalmente hasta 90 días). Puedes solicitar la eliminación de tu cuenta y datos asociados en cualquier momento contactándonos; los eliminaremos excepto cuando debamos conservar registros (por ejemplo, el historial de facturación) por razones legales."
rights = "11. Tus derechos"
rights_description = "Según dónde vivas, puedes acceder, corregir, eliminar o exportar tus datos personales, oponerte a su tratamiento o solicitar su limitación, y retirar el consentimiento que hayas dado (por ejemplo, para los análisis). Puedes actualizar tu correo y nombre de usuario desde la configuración de tu cuenta en cualquier momento; para cualquier otra gestión, escribe a info@litepod.sh y responderemos en un plazo de 30 días. También tienes derecho a presentar una reclamación ante tu autoridad de protección de datos."
security = "10. Seguridad"
security_description = "Usamos medidas estándar de la industria para proteger tus datos, incluido el hash de contraseñas y las conexiones cifradas (TLS). Ningún método de transmisión o almacenamiento es 100 % seguro, pero trabajamos para proteger tu información."
sell_data = "No vendemos tus datos."
service_data = "4. Datos que guardas en el Servicio"
service_data_description = "Para ejecutar tus despliegues, el Servicio guarda lo que configuras en él: direcciones de servidores y las claves SSH para acceder a ellos, conexiones y tokens de proveedores de Git, variables de entorno y secretos, dominios y certificados, credenciales de S3 para copias, logs de despliegues y contenedores, métricas y un registro de auditoría de las acciones en tus organizaciones. Las credenciales se cifran en reposo. Estos datos pertenecen a tu organización: solo los ven los miembros con los permisos adecuados, y nosotros solo cuando es necesario para darte soporte o mantener el Servicio seguro. Los logs y registros de auditoría se guardan por un tiempo limitado y se eliminan junto con tu organización."
use_data = "7. Cómo usamos tus datos"
use_data_1 = "Para crear y proteger tu cuenta, y permitirte iniciar sesión."
use_data_2 = "Para enviarte correos relacionados con la cuenta y la facturación."
use_data_3 = "Para brindarte asistencia cuando la solicites."
use_data_4 = "Para mantener el Servicio confiable y seguro, y mejorarlo."

[terms]
acceptance = "1. Aceptación de los términos"
acceptance_description = "Al crear una cuenta o usar litepod de cualquier otra forma (el \"Servicio\"), aceptas estos Términos de servicio. Si no estás de acuerdo, no uses el Servicio."
accounts = "3. Cuentas"
accounts_description = "Necesitas una cuenta para usar litepod. Una cuenta requiere una dirección de correo y un nombre de usuario, y está protegida por una contraseña y, opcionalmente, autenticación de dos factores. Eres responsable de mantener tus credenciales confidenciales y de toda actividad que ocurra en tu cuenta. Avísanos de inmediato si sospechas acceso no autorizado."
availability = "14. Disponibilidad y descargo de garantías"
availability_description = "El Servicio se proporciona \"tal cual\" y \"según disponibilidad\", sin garantías de ningún tipo, expresas o implícitas. No garantizamos que el Servicio sea ininterrumpido, seguro o libre de errores."
backups = "12. Copias de seguridad"
backups_description = "Las copias de las bases de datos se guardan en el almacenamiento compatible con S3 que configura tu organización; litepod no guarda su propia copia de los datos de tus aplicaciones. Eres responsable de esa cuenta de almacenamiento, de comprobar que las copias se completan y de probar las restauraciones. No somos responsables por datos perdidos porque una copia no estaba configurada, falló o fue borrada de tu almacenamiento."
changes = "20. Cambios a estos términos"
changes_description = "Podemos actualizar estos términos de vez en cuando. Si hacemos cambios importantes, actualizaremos la fecha de \"Última actualización\" anterior y, cuando corresponda, te avisaremos."
company_information = "19. Información de la empresa"
company_information_description = "litepod es operado por Litepod Studio. Para avisos legales, preguntas de facturación, reembolsos o solicitudes sobre tus datos, escríbenos a info@litepod.sh."
complaints = "18. Reclamaciones y resolución de disputas"
complaints_description = "Si algo salió mal, escribe a info@litepod.sh con el asunto \"Reclamación\". Confirmamos cada reclamación en un plazo de 2 días hábiles y buscamos resolverla en 14 días. Si no quedas satisfecho con nuestra respuesta, puedes escalar el asunto ante tu autoridad local de protección al consumidor o tu defensor del pueblo comercial (trade ombudsman), o usar el servicio de resolución de disputas en línea de la Comisión Europea."
contact = "21. Contacto"
contact_description = "¿Preguntas sobre estos términos? Contáctanos en"
content = "8. Tu contenido y despliegues"
content_description = "Conservas la propiedad del código, las imágenes y los datos que despliegues mediante litepod. Eres el único responsable de ese contenido y de tener los derechos necesarios para desplegarlo."
data_processing = "11. Datos personales en tus aplicaciones"
data_processing_description = "Tus aplicaciones pueden tratar datos personales de tus propios usuarios. Para esos datos tú eres el responsable del tratamiento y litepod actúa solo como encargado: los tratamos únicamente para prestar el Servicio según tus instrucciones, los mantenemos confidenciales, los protegemos con medidas de seguridad adecuadas, usamos subencargados solo como se describe en nuestra Política de privacidad y te ayudamos a responder solicitudes de los titulares cuando el Servicio lo permite. Tú eres responsable de tener una base legal para ese tratamiento y de informar a tus usuarios. Si necesitas un acuerdo de encargo de tratamiento firmado, contáctanos."
indemnity = "16. Indemnización"
indemnity_description = "Aceptas indemnizar a litepod frente a reclamaciones de terceros que surjan del contenido que despliegas, de tu uso del Servicio incumpliendo estos términos o la Política de uso aceptable, o de tu incumplimiento de la ley o de derechos de terceros."
liability = "15. Limitación de responsabilidad"
liability_description = "En la máxima medida permitida por la ley, litepod no será responsable de daños indirectos, incidentales o consecuentes derivados de tu uso del Servicio."
merchant_of_record = "6. Comerciante registrado"
merchant_of_record_description = "Nuestro proceso de pedido lo gestiona nuestro revendedor en línea Polar.sh. Polar.sh es el Comerciante Registrado (Merchant of Record) de todos nuestros pedidos. Polar atiende todas las consultas de atención al cliente y gestiona las devoluciones."
refund_cancellations = "Cancelaciones, renovaciones y solicitudes posteriores"
refund_how = "Cómo solicitar un reembolso"
refund_policy = "5. Política de reembolso"
refund_policy_description = "Ofrecemos una garantía de devolución de dinero de 30 días. Si no estás satisfecho con litepod por cualquier motivo, contáctanos dentro de los 30 días posteriores a tu compra o a tu renovación más reciente y te reembolsaremos el importe total pagado por ese período. Sin condiciones, sin preguntas y sin retener comisiones."
refund_policy_how = "Para solicitar un reembolso, escribe a info@litepod.sh desde el correo de tu cuenta o abre el portal del cliente de Polar desde la configuración de tu suscripción y solicítalo allí. Polar.sh, nuestro comerciante registrado, emite el reembolso a tu método de pago original."
refund_policy_renewals = "Cancelar detiene los cargos futuros, pero no es en sí mismo un reembolso: tu acceso continúa hasta el final del período de facturación que ya pagaste. Las solicitudes posteriores a los 30 días se revisan caso por caso, y nada en esta política limita los derechos de reembolso que te correspondan según la ley de consumo aplicable."
security = "10. Responsabilidad compartida de la seguridad"
security_description = "La seguridad es compartida. Nosotros protegemos el plano de control de litepod, ciframos en reposo las credenciales guardadas (claves SSH, tokens de Git, variables de entorno y claves de S3) y mantenemos los datos de cada organización separados de los de las demás. Tú eres responsable de las credenciales de tu cuenta y de la autenticación en dos pasos, de a quién invitas a tus organizaciones y qué roles le das, del código, las imágenes y las dependencias que despliegas, de los secretos que configuras y de mantener tus servidores actualizados. Avísanos de inmediato a info@litepod.sh si sospechas que tu cuenta o un servidor conectado fue comprometido."
servers = "9. Tus servidores y el acceso que nos das"
servers_description = "Cuando conectas un servidor, le das a litepod una clave SSH que permite al Servicio entrar a ese servidor y ejecutar comandos en él: instalar y actualizar software, construir y ejecutar contenedores, configurar el proxy inverso y leer logs y métricas. El Servicio usa este acceso solo para hacer lo que le pides y para mantener tus despliegues funcionando. Debes ser el propietario del servidor o estar autorizado para dar este acceso. Puedes revocarlo en cualquier momento quitando el servidor de litepod y borrando su clave del servidor. Sigues siendo responsable del servidor en sí: tu contrato con el proveedor, su sistema operativo, su firewall y todo lo que ejecutes en él fuera de litepod."
subscriptions = "4. Suscripciones y pagos"
subscriptions_cancellation = "Puedes cancelar una suscripción en cualquier momento desde la configuración de tu cuenta o desde el portal del cliente de Polar. La cancelación entra en vigor al final del período de facturación que ya pagaste y detiene todos los cargos futuros: conservas el acceso hasta entonces. Las tarifas ya facturadas se reembolsan según lo indicado en la sección 5."
subscriptions_description = "Algunas funciones se ofrecen como suscripciones de pago. Polar procesa los pagos, como nuestro procesador de pagos y, cuando corresponda, comerciante registrado. Al suscribirte, autorizas a Polar a cobrar tu método de pago elegido de forma recurrente, mensual o anual según el intervalo que elijas, hasta que canceles. Tu suscripción se renueva automáticamente al inicio de cada período de facturación y te avisaremos con antelación de cualquier cambio de precio o de intervalo de facturación. litepod no recibe ni almacena los datos completos de tu tarjeta; Polar los maneja directamente, sujeto a sus propios términos y política de privacidad."
suspension = "13. Suspensión"
suspension_description = "Podemos suspender todo o parte del Servicio para tu cuenta sin aviso previo cuando sea necesario para evitar un daño: un incidente de seguridad, un ataque que sale de tus despliegues o que va dirigido a ellos, un incumplimiento de la Política de uso aceptable que esté causando daño, una obligación legal o la falta de pago después del período de gracia. Cuando podamos, te diremos el motivo, y restableceremos el Servicio cuando la causa se haya resuelto."
termination = "17. Terminación"
termination_description = "Puedes dejar de usar el Servicio y eliminar tu cuenta en cualquier momento. Podemos suspender o cancelar cuentas que infrinjan estos términos o la legislación aplicable."
terms_of_service = "Términos de servicio"
use = "7. Uso aceptable"
use_description = "Debes cumplir nuestra Política de uso aceptable, que forma parte de estos términos. En resumen: nada de contenido ilegal, infractor o malicioso, nada de ataques a otras personas o al Servicio, y nada de evadir límites de uso o controles de seguridad. Podemos suspender o cerrar las cuentas que la incumplan."
what_is = "2. Qué es litepod"
what_is_description = "litepod es una plataforma para desplegar y gestionar aplicaciones en tu propia infraestructura o en una instancia alojada. Te permite conectar un repositorio Git u otra fuente, compilarlo y ejecutarlo como un despliegue basado en contenedores."

[self_hosted]
title = "Sobre esta instancia"
terms_description = "Estos Términos de servicio se aplican a litepod Cloud, el servicio operado por Litepod Studio. Esta es una instancia autohospedada de litepod, por lo que Litepod Studio no la opera y no es parte de tu uso de la misma. El operador de esta instancia es responsable de los términos y condiciones que se le apliquen a ella y a los servicios que preste. Nada en esta página crea un acuerdo entre tú y Litepod Studio."
privacy_description = "Esta Política de privacidad describe cómo Litepod Studio trata los datos personales en litepod Cloud. Esta es una instancia autohospedada de litepod, por lo que Litepod Studio no la opera y no recopila ni trata los datos personales que se guardan en ella. El operador de esta instancia es responsable de cómo recopila, usa y protege los datos personales, y de proporcionar el aviso de privacidad que exija la ley."
refund_description = "Los reembolsos no se aplican a las instancias autohospedadas de litepod. Litepod Studio no cobra por ellas, así que no hay nada que Litepod Studio deba reembolsar. Cualquier relación de pago o facturación que tengas es con el operador de esta instancia o con tus propios proveedores de infraestructura, no con Litepod Studio."
acceptable_use_description = "Esta Política de uso aceptable describe las reglas de litepod Cloud, el servicio operado por Litepod Studio. Esta es una instancia autohospedada de litepod, por lo que Litepod Studio no la opera ni hace cumplir estas reglas. El operador de esta instancia es responsable de establecer y hacer cumplir sus propias reglas de uso aceptable. Sigues siendo responsable de cumplir la ley que te aplique a ti y a tus usuarios."
