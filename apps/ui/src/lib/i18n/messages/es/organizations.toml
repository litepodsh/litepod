[sso.help]
about = "Qué es {field}"
equivalents = "Cómo se llama en tu proveedor de identidad"
name = "Solo para reconocer la conexión en Litepod. No tiene que coincidir con nada del IdP."
protocol = "OpenID Connect y SAML 2.0 hacen lo mismo: el inicio de sesión. Usa OpenID Connect salvo que tu IdP no lo soporte o tu equipo de seguridad exija SAML. No se puede cambiar después de crear la conexión."
issuer = "La URL base del IdP. Litepod lee de ahí sus endpoints y sus claves de firma. Debe ser HTTPS. En Entra termina en /v2.0, sin barra final."
client_id = "El identificador público de la app que registraste en el IdP. En Entra es el Application (client) ID de Overview: no confundir con el Object ID ni con el Secret ID."
client_secret = "La contraseña de esa app. En Entra copia la columna Value del secreto, no el Secret ID; se oculta al salir de la página y caduca en la fecha de Expires."
groups_claim = "El nombre del dato del token que trae los grupos del usuario. Litepod lo usa para el mapeo de grupos. Sin grupos, todos entran con el rol base."
default_role = "El rol en la organización que recibe cada persona que entra por SSO por primera vez. Los permisos extra se dan con el mapeo de grupos."
jit = "Just-in-time: si la persona no existe en Litepod, se crea en su primer inicio de sesión. Desmarcado, solo pueden entrar usuarios que ya existan o lleguen por SCIM."
enabled = "Solo las conexiones activadas se usan en el login. Necesita un dominio verificado, y solo puede haber una conexión activa por dominio."
idp_metadata = "El XML que describe al IdP: su URL de login y su certificado de firma. Pega el contenido completo del archivo. Debe incluir el certificado; SHA-1 se rechaza."
redirect_uri = "La dirección a la que el IdP devuelve al usuario después del login. Cópiala en el IdP tal cual, carácter por carácter, o el IdP responde con un error (en Entra, AADSTS50011)."
session_ttl = "Lo máximo que dura una sesión de Litepod de este proveedor. Más corta significa que quien sea dado de baja en el IdP pierde el acceso antes; volver a entrar suele ser instantáneo mientras la sesión del IdP siga viva. 60 es un buen valor."
post_logout_redirect_uri = "Adónde envía el proveedor el navegador después de que Litepod cierre la sesión en él. Agrégala a las URLs de cierre de sesión permitidas del IdP o el IdP mostrará un error. En Entra, agrega también auth_time como claim opcional del ID token (Token configuration) para que los inicios forzados se puedan verificar."
backchannel_logout_url = "El proveedor llama aquí cuando un admin cierra la sesión de un usuario, y Litepod lo saca al instante. En Keycloak, desactiva 'Backchannel logout session required'. Entra y Okta no lo soportan; usa SCIM."
acs_url = "La dirección a la que el IdP envía la respuesta SAML firmada. Cópiala en el IdP tal cual."
sp_entity_id = "El identificador de Litepod para este IdP. Cópialo en el IdP; debe coincidir exactamente o el IdP responde que la aplicación no existe."
external_group = "El identificador del grupo tal como lo manda el IdP en el claim de grupos. Entra manda Object IDs, no nombres."
tenant_url = "La URL a la que el IdP envía altas, bajas y cambios de grupo (SCIM). Tiene que ser accesible desde internet por HTTPS."
secret_token = "El token con el que el IdP se autentica al llamar a SCIM. Se muestra una sola vez; generar uno nuevo invalida el anterior."

