services:
  # Build daemon for Railpack deploys. Not published to the host: only the
  # Podman network can reach it.
  buildkit:
    image: docker.io/moby/buildkit:latest
    container_name: litepod-buildkit
    privileged: true
    command: ["--addr", "tcp://0.0.0.0:1234"]
    volumes:
      - buildkit_cache:/var/lib/buildkit
    restart: unless-stopped

  caddy:
    image: caddy:${CADDY_IMAGE_TAG:-2.11.4}
    container_name: litepod-caddy
    command: ["caddy", "run", "--resume", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:${DRAGONFLY_IMAGE_TAG:-v2.0.2}
    container_name: litepod-dragonfly
    restart: unless-stopped
    environment:
      DFLY_requirepass: ${DFLY_PASSWORD:?Set DFLY_PASSWORD in apps/.env}

  app:
    container_name: litepod-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAEJF4ZVxaxz5WzUH"
    environment:
      APP_ENV: staging
      PORT: "6001"
      UI_DIST_PATH: /app/ui
      # Container names, not Compose service names: a deployed app's Compose file
      # joins this same network and would otherwise claim `caddy`/`dragonfly` as
      # DNS aliases and steal these connections.
      DATABASE_PATH: /var/lib/litepod/litepod.db
      HASH_SECRET: ${HASH_SECRET:?Set HASH_SECRET in apps/.env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in apps/.env}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      CADDY_URL: http://litepod-caddy:2019
      CADDY_ADMIN_URL: http://litepod-caddy:2019
      DRAGONFLY_URL: redis://:${DFLY_PASSWORD:?Set DFLY_PASSWORD in apps/.env}@litepod-dragonfly:6379
      PODMAN_SOCKET: ${LITEPOD_PODMAN_SOCKET:?Set by scripts/install-staging.sh}
      LITEPOD_DATA_DIR: /var/lib/litepod
      LITEPOD_DATA_VOLUME: litepod_data
      LITEPOD_PODMAN_NETWORK: litepod-network
      # The self-updater recreates this container under this name. Without it the
      # name is probed at boot, and a wrong answer costs Caddy's `litepod-api:6001`
      # catch-all.
      LITEPOD_CONTAINER_NAME: litepod-api
      LITEPOD_PUBLIC_IP: ${LITEPOD_PUBLIC_IP:?Set LITEPOD_PUBLIC_IP in apps/.env}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in apps/.env}
      CORS_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL in apps/.env}
      LITEPOD_STACK_ENV_FILE: /etc/litepod-stack/.env
      LITEPOD_LOCAL_SSH_HOST: host.containers.internal
      LITEPOD_LOCAL_SSH_PORT: "22"
      LITEPOD_LOCAL_SSH_USER: ${LITEPOD_LOCAL_SSH_USER:?Repair with scripts/install-staging.sh}
      LITEPOD_LOCAL_SSH_FINGERPRINT: ${LITEPOD_LOCAL_SSH_FINGERPRINT:?Repair with scripts/install-staging.sh}
      LITEPOD_LOCAL_SSH_KEY_FILE: /run/litepod-host-ssh/id_ed25519
      LITEPOD_LOCAL_SSH_KNOWN_HOSTS_FILE: /run/litepod-host-ssh/known_hosts
    extra_hosts:
      - "host.containers.internal:host-gateway"
    volumes:
      - ${LITEPOD_PODMAN_SOCKET_PATH:?Set by scripts/install-staging.sh}:${LITEPOD_PODMAN_SOCKET_PATH:?Set by scripts/install-staging.sh}
      - litepod_data:/var/lib/litepod
      - ./:/etc/litepod-stack:rw
      - /opt/litepod-staging-host-console/id_ed25519:/run/litepod-host-ssh/id_ed25519:ro
      - /opt/litepod-staging-host-console/known_hosts:/run/litepod-host-ssh/known_hosts:ro
    depends_on:
      - caddy
      - dragonfly
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  buildkit_cache:
  litepod_data:
    name: litepod_data

networks:
  # litepod's core stack and dynamically-created application containers share
  # one named network so Caddy can resolve application container aliases.
  default:
    external: true
    name: litepod-network
